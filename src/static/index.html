<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinUni ReAct Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar: Agent Logs (Thoughts/Actions) -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <h2>🧠 Agent Thoughts</h2>
                <div class="pulse-indicator" id="status-indicator"></div>
            </div>
            <div class="log-container" id="log-container">
                <div class="log-entry system-msg">Hệ thống sẵn sàng. Vui lòng nhập câu hỏi bên phải...</div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area glass-panel">
            <header class="chat-header">
                <h1>VinUni Tâm Lý Assistant</h1>
                <p>Mô phỏng tư vấn tâm lý tự động sử dụng AI ReAct Agent</p>
            </header>
            
            <div class="chat-history" id="chat-history">
                <div class="message ai-message">
                    <div class="message-bubble">
                        Xin chào! Tôi là Trợ lý Ảo được xây dựng trên cấu trúc ReAct Agent. Bạn đang gặp phải vấn đề tâm lý hoặc áp lực nào không? Hãy chia sẻ với tôi nhé.
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <form id="chat-form">
                    <input type="text" id="user-input" placeholder="Bạn đang cảm thấy thế nào..." autocomplete="off" required>
                    <button type="submit" id="send-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </div>
        </main>
    </div>
    
    <script src="/static/script.js"></script>
</body>
</html>
